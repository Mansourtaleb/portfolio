server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assistant IA : réponses en streaming (SSE) -> pas de mise en tampon
    location /api/public/assistant/chat {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tout le reste de l'API, la doc Swagger et les fichiers SEO -> backend
    location ~ ^/(api|swagger-ui|v3/api-docs|sitemap\.xml|robots\.txt) {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;
    }

    # Fichiers versionnés par Angular : cache long
    location ~* \.(js|css|woff2?|png|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker et index : jamais en cache (sinon pas de mise à jour)
    location ~ ^/(ngsw\.json|ngsw-worker\.js|index\.html)$ {
        add_header Cache-Control "no-cache";
    }

    # Routes Angular (/projects/x, /admin…) -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}