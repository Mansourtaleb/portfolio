# Base de données de développement.
# Lancer : docker compose up -d db
services:
  db:
    image: postgres:17-alpine
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-portfolio}
      POSTGRES_USER: ${DB_USERNAME:-portfolio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-portfolio}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - portfolio-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-portfolio} -d ${DB_NAME:-portfolio}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  portfolio-db:
