apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    app: api               # le ServiceMonitor sélectionne le Service par ce label
spec:
  selector:
    app: api
  ports:
    - name: http           # nommé : le ServiceMonitor s'y réfère
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/portfolio-api:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
          env:
            - { name: DB_HOST, value: db }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: {{ .Values.db.name | quote }} }
            - { name: DB_USERNAME, value: {{ .Values.db.user | quote }} }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: DB_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: JWT_SECRET }
            - { name: ADMIN_USERNAME, value: admin }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: ADMIN_PASSWORD }
            - { name: APP_ASSISTANT_EMBEDDINGS_ENABLED, value: "false" }
            - { name: SITE_URL, value: {{ .Values.api.siteUrl | quote }} }
            {{- if .Values.monitoring.enabled }}
            # Expose /actuator/prometheus dans le cluster uniquement
            - { name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE, value: "health,prometheus" }
            - { name: MANAGEMENT_METRICS_TAGS_APPLICATION, value: "portfolio-api" }
            {{- end }}
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}