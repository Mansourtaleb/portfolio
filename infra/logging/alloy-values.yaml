# Grafana Alloy : collecte les logs des pods et les envoie à Loki (successeur de Promtail)
alloy:
  resources:
    requests: { memory: 64Mi, cpu: 20m }
    limits:   { memory: 256Mi }
  configMap:
    content: |
      // 1. Découvre tous les pods du cluster via l'API Kubernetes
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // 2. Transforme les métadonnées Kubernetes en labels Loki (peu nombreux : ce sont les index)
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "kube-system|local-path-storage"
          action        = "drop"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
      }

      // 3. Lit les logs des conteneurs via l'API Kubernetes (pas besoin de monter /var/log)
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.local.receiver]
      }

      // 4. Pousse les logs vers Loki
      loki.write "local" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }
