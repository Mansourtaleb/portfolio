# kube-prometheus-stack allégé pour un poste de 16 Go
alertmanager:
  enabled: false            # alertes visibles dans Prometheus/Grafana ; pas d'envoi de notifications ici

prometheus:
  prometheusSpec:
    # Prend en compte les ServiceMonitor / PrometheusRule de TOUS les namespaces (dont « portfolio »)
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 2d
    resources:
      requests: { memory: 400Mi, cpu: 100m }
      limits:   { memory: 1Gi }

grafana:
  resources:
    requests: { memory: 128Mi, cpu: 50m }
    limits:   { memory: 256Mi }

# kind ne fournit pas ces composants sous une forme supervisable : on évite les fausses alertes
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
