# kube-prometheus-stack allégé pour un poste de 16 Go
alertmanager:
  enabled: true
  alertmanagerSpec:
    retention: 24h
    resources:
      requests: { memory: 64Mi, cpu: 20m }
      limits:   { memory: 128Mi }
  config:
    global:
      # Mailpit : faux serveur SMTP dans le cluster (aucun vrai mail envoyé, aucun mot de passe)
      smtp_smarthost: mailpit.monitoring.svc:1025
      smtp_from: alertmanager@portfolio.local
      smtp_require_tls: false
    route:
      receiver: email
      group_by: [alertname, namespace]
      group_wait: 30s        # attend 30 s pour regrouper les alertes qui arrivent ensemble
      group_interval: 5m     # délai avant de notifier une nouvelle alerte dans un groupe déjà notifié
      repeat_interval: 4h    # relance si l'alerte est toujours active
      routes:
        # Watchdog sonne en permanence (preuve de vie) : on ne veut pas un mail toutes les 4 h
        - receiver: "null"
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
    receivers:
      - name: "null"
      - name: email
        email_configs:
          - to: equipe@portfolio.local
            send_resolved: true   # mail aussi quand l'incident est résolu

prometheus:
  prometheusSpec:
    # Prend en compte les ServiceMonitor / PrometheusRule de TOUS les namespaces (dont « portfolio »)
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 2d
    resources:
      requests: { memory: 400Mi, cpu: 100m }
      limits:   { memory: 1Gi }

grafana:
  # Source de données Loki (logs), à côté de Prometheus (métriques)
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc:3100
      access: proxy
  resources:
    requests: { memory: 256Mi, cpu: 50m }
    limits:   { memory: 512Mi }   # 256Mi : OOMKilled au démarrage (migrations SQLite)

# kind ne fournit pas ces composants sous une forme supervisable : on évite les fausses alertes
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
