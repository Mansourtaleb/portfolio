# Cluster local à 1 nœud. Le port 30080 du cluster est publié sur http://localhost:8088
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: portfolio
# containerd lit la config des registres dans /etc/containerd/certs.d (pour Nexus)
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8088