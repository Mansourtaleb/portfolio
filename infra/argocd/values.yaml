# Argo CD allégé pour un poste de 16 Go (chart argo/argo-cd)
dex:
  enabled: false              # pas de SSO : connexion avec le compte admin local
notifications:
  enabled: false
applicationSet:
  enabled: false              # une seule application : pas besoin du générateur

configs:
  params:
    server.insecure: true     # HTTP simple derrière le port-forward (pas de certificat à gérer en local)
  cm:
    timeout.reconciliation: 60s   # Argo CD relit Git toutes les 60 s (180 s par défaut)

controller:
  resources:
    requests: { memory: 256Mi, cpu: 100m }
    limits:   { memory: 768Mi }
repoServer:
  resources:
    requests: { memory: 128Mi, cpu: 50m }
    limits:   { memory: 512Mi }
server:
  resources:
    requests: { memory: 64Mi, cpu: 50m }
    limits:   { memory: 256Mi }
redis:
  resources:
    requests: { memory: 32Mi, cpu: 20m }
    limits:   { memory: 128Mi }
