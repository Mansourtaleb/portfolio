# Front Angular servi par nginx, exposé sur le port 30080 du nœud (= http://localhost:8088)
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: portfolio
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: portfolio
spec:
  replicas: 2                 # deux copies : si l'une tombe, le site reste en ligne
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: localhost:8083/portfolio-web:1.0.11
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 20
          resources:
            requests: { memory: 32Mi, cpu: 50m }
            limits:   { memory: 128Mi }