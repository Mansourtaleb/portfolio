name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule un run en cours si un nouveau push arrive sur la même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests + couverture)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests unitaires et d'intégration (Testcontainers)
        run: ./mvnw -B verify
      - name: Rapport de couverture JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  frontend:
    name: Frontend (build production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npx ng build --configuration production

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]   # seulement si les tests et le build passent
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image API
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: portfolio-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Image Web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: portfolio-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web