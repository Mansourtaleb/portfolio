spring:
  application:
    name: portfolio-api
  # Charge le fichier .env (racine du dépôt ou dossier backend) comme source de propriétés
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:portfolio}
    username: ${DB_USERNAME:portfolio}
    password: ${DB_PASSWORD:portfolio}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl: 8h
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  assistant:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
    max-tokens: 4096
    top-k: 6
    max-question-length: 500
    requests-per-minute-per-ip: 6
    requests-per-day: 300
    embeddings:
      enabled: true
      models-dir: ${EMBEDDINGS_DIR:./.models}
      model-url: https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/onnx/model_quantized.onnx
      tokenizer-url: https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/tokenizer.json

logging:
  level:
    com.taleb.portfolio: INFO
