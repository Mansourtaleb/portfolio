spring:
  application:
    name: portfolio-api
  # Charge le fichier .env (racine du dépôt ou dossier backend) comme source de propriétés
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:portfolio}${DB_PARAMS:}
    username: ${DB_USERNAME:portfolio}
    password: ${DB_PASSWORD:portfolio}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  # E-mail (notification des messages de contact) : désactivé tant que SMTP_HOST est vide
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: method

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health

app:
  notifications:
    email-to: ${NOTIFY_EMAIL:}
    email-from: ${MAIL_FROM:portfolio@localhost}
    site-url: ${SITE_URL:http://localhost:4200}
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl: 8h
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  assistant:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
    max-tokens: 4096
    top-k: 6
    max-question-length: 500
    requests-per-minute-per-ip: 6
    requests-per-day: 300
    embeddings:
      enabled: true
      models-dir: ${EMBEDDINGS_DIR:./.models}
      model-url: https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/onnx/model_quantized.onnx
      tokenizer-url: https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/tokenizer.json

logging:
  level:
    com.taleb.portfolio: INFO
